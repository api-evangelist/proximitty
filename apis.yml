aid: proximitty
name: Proximitty
description: 'Proximitty is a Y Combinator-backed company building an AI operating
  system for commercial lending. Its platform deploys regulator-grade AI agents that
  ingest and parse borrower documents, spread financials, generate credit memos, automate
  loan operations, and continuously track covenants and closing obligations for FDIC-insured
  banks, credit unions, and non-bank lenders originating C&I, CRE, and SBA loans. The
  system is designed to align with SR 11-7 and OCC guidance on AI governance and third-party
  risk, and claims to compress underwriting from weeks to minutes while enabling loan
  closures in under ten days. Proximitty publishes no public developer API, OpenAPI
  specification, SDK, or developer portal; it is delivered as a hosted SaaS product,
  and its public surface is limited to a marketing site, blog, security/compliance
  page, and a hosted Trust Center.'
